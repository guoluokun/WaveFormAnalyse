[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waveform-analyse"
version = "0.2.0"
description = "Lightweight waveform processing, visualization and algorithm validation tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "uproot>=5.3",
  "awkward>=2.6",
  "pyqtgraph>=0.13.4",
  "PyQt5>=5.15",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
wfa = "wfa.__main__:main"

[tool.setuptools.packages.find]
include = ["wfa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
